<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>盘口分析工作台 V17</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e8eef8;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:#0b1728;border-bottom:1px solid #1c304a;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-weight:800;font-size:18px}.ver{font-size:11px;color:#7f93ad}.tabs{display:flex;overflow:auto;background:#0b1728;border-bottom:1px solid #1c304a}.tabs button{white-space:nowrap;background:none;border:0;color:#91a4bd;padding:12px 14px}.tabs button.on{color:#fff;border-bottom:2px solid #55a7ff}.wrap{max-width:1200px;margin:auto;padding:16px}.page{display:none}.page.on{display:block}.card{background:#0d1b2e;border:1px solid #1c304a;border-radius:14px;padding:14px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#101f33;border-radius:12px;padding:13px}.stat b{display:block;font-size:23px;margin-top:5px}.muted{color:#8195ae}.btn{border:1px solid #2c4767;background:#13263e;color:#eaf2ff;padding:9px 12px;border-radius:9px}.primary{background:#1769aa;border-color:#2d8bd0}.danger{background:#6d2531}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select{background:#091625;color:#eaf2ff;border:1px solid #29415f;border-radius:8px;padding:9px}input{min-width:150px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #1d3048}th{color:#90a6bf;font-weight:600}.pill{display:inline-block;border:1px solid #31506f;border-radius:999px;padding:3px 8px;color:#a9c6e4;font-size:12px}.ok{color:#65d391}.bad{color:#ff7f8f}.match{padding:11px;border:1px solid #203750;border-radius:11px;margin:8px 0}.match strong{display:block;margin-bottom:5px}.small{font-size:12px}.notice{padding:10px;border-radius:9px;background:#10253b;color:#a9c8e7}.hero{font-size:24px;font-weight:800;margin:8px 0 16px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}table{font-size:12px}.wrap{padding:10px}.hero{font-size:20px}header{padding:12px}.card{padding:11px}}
</style></head><body>
<header><div><div class="brand">📊 盘口分析工作台</div><div class="ver">V17 云端全球版</div></div><div id="cloudState" class="small muted">未登录</div></header>
<nav class="tabs" id="tabs"></nav><main class="wrap">
<section id="home" class="page on"><div class="hero">比赛数据驾驶舱</div><div class="grid"><div class="stat">比赛库<b id="sMatches">0</b></div><div class="stat">事件<b id="sEvents">0</b></div><div class="stat">记录<b id="sBets">0</b></div><div class="stat">复盘<b id="sReviews">0</b></div></div><div class="card"><div class="notice">先进入「🌍 全球赛事」检查 Sportmonks，再同步比赛。这里不提供投注推荐，只做数据、计算、监控和复盘。</div></div></section>
<section id="matches" class="page"><div class="hero">比赛库</div><div class="card"><div id="matchList"></div></div></section>
<section id="market" class="page"><div class="hero">盘口分析</div><div class="card"><div class="row"><input id="oddsA" placeholder="主/大水位 例如 0.92"><input id="oddsB" placeholder="客/小水位 例如 0.98"><button class="btn primary" onclick="calcWater()">计算概率</button></div><p id="waterOut" class="notice">输入两边水位。</p></div></section>
<section id="calc" class="page"><div class="hero">计算</div><div class="card"><div class="row"><input id="eu" placeholder="欧赔，例如 2.00"><button class="btn primary" onclick="calcEU()">换算</button></div><p id="euOut" class="notice"></p></div></section>
<section id="kelly" class="page"><div class="hero">凯利</div><div class="card"><div class="row"><input id="kp" placeholder="你的概率 %"><input id="ko" placeholder="十进制赔率"><input id="bank" placeholder="资金"><button class="btn primary" onclick="calcKelly()">计算</button></div><p id="kOut" class="notice"></p></div></section>
<section id="stats" class="page"><div class="hero">统计</div><div class="card"><div id="statsOut"></div></div></section>
<section id="review" class="page"><div class="hero">复盘</div><div class="card"><p>这里保留比赛与事件数据，后续可继续升级成长期 ROI、命中率、回撤和异常统计。</p></div></section>
<section id="cloud" class="page"><div class="hero">云端</div><div class="card"><div class="row"><input id="user" placeholder="用户名"><input id="pass" type="password" placeholder="密码"><button class="btn" onclick="register()">注册</button><button class="btn primary" onclick="login()">登录</button><button class="btn" onclick="logout()">退出</button></div><div id="cloudMsg" class="notice" style="margin-top:10px">账号数据可同步到 Railway。</div></div></section>
<section id="global" class="page"><div class="hero">🌍 全球赛事</div><div class="card"><div class="row"><input type="date" id="date"><input id="q" placeholder="搜索联赛/球队"><select id="refresh"><option value="0">关闭自动刷新</option><option value="60000">每1分钟</option><option value="120000">每2分钟</option><option value="300000">每5分钟</option></select><button class="btn" onclick="checkSource()">检查数据源</button><button class="btn primary" onclick="loadFixtures()">立即同步比赛</button><button class="btn" onclick="loadLive()">同步滚球</button></div><p id="source" class="notice">尚未检查数据源</p></div><div class="card"><h3>今日/指定日期比赛</h3><div id="fixtures">点击「立即同步比赛」</div></div><div class="card"><h3>滚球</h3><div id="live">点击「同步滚球」</div></div></section>
</main>
<script>
const nav=[["home","总览"],["matches","比赛库"],["market","盘口"],["calc","计算"],["kelly","凯利"],["stats","统计"],["review","复盘"],["cloud","云端"],["global","🌍 全球赛事"]];
let db=JSON.parse(localStorage.getItem("pankou_v17_db")||'{"version":17,"matches":[],"events":[],"bets":[],"reviews":[],"settings":{}}');let timer=null;
const $=id=>document.getElementById(id); const save=()=>{localStorage.setItem("pankou_v17_db",JSON.stringify(db));renderStats();renderMatches()};
function api(path,opt={}){return fetch(path,{...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}}).then(async r=>{let j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"请求失败");return j})}
$("tabs").innerHTML=nav.map(x=>`<button data-page="${x[0]}">${x[1]}</button>`).join("");
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>show(b.dataset.page));
function show(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));$(id).classList.add("on");document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x.dataset.page===id));if(id==="global"){$("date").value=$("date").value||new Date().toISOString().slice(0,10)}}
function renderStats(){$("sMatches").textContent=db.matches.length;$("sEvents").textContent=db.events.length;$("sBets").textContent=db.bets.length;$("sReviews").textContent=db.reviews.length;$("statsOut").innerHTML=`比赛 ${db.matches.length} · 事件 ${db.events.length} · 记录 ${db.bets.length} · 复盘 ${db.reviews.length}`;localStorage.setItem("pankou_v17_db",JSON.stringify(db))}
function renderMatches(){$("matchList").innerHTML=db.matches.length?db.matches.map(m=>`<div class="match"><strong>${m.home?.name||"主队"} vs ${m.away?.name||"客队"}</strong><span class="pill">${m.leagueName||"未知联赛"}</span> <span class="small muted">${m.date||""}</span></div>`).join(""):"暂无比赛，请去全球赛事同步。"}
function calcWater(){let a=+$("oddsA").value,b=+$("oddsB").value;if(!(a>0&&b>0))return $("waterOut").textContent="请输入两个有效水位";let pa=1/(a+1),pb=1/(b+1),s=pa+pb;$("waterOut").textContent=`原始概率：${(pa*100).toFixed(2)}% / ${(pb*100).toFixed(2)}%；归一化：${(pa/s*100).toFixed(2)}% / ${(pb/s*100).toFixed(2)}%；超额 ${((s-1)*100).toFixed(2)}%`}
function calcEU(){let o=+$("eu").value;if(!(o>1))return $("euOut").textContent="请输入大于1的欧赔";$("euOut").textContent=`隐含概率 ${(100/o).toFixed(2)}%`}
function calcKelly(){let p=(+$("kp").value||0)/100,o=+$("ko").value,b=+$("bank").value;if(!(p>0&&p<1&&o>1&&b>0))return $("kOut").textContent="请填写概率、赔率和资金";let f=((o-1)*p-(1-p))/(o-1);$("kOut").textContent=`凯利比例 ${(f*100).toFixed(2)}%；按资金计算 ${Math.max(0,f*b).toFixed(2)}。仅作数学计算，不构成投注建议。`}
async function checkSource(){try{let j=await api("/api/global/status");$("source").innerHTML=`<span class="ok">● 数据源正常</span>　${j.message||""}`}catch(e){$("source").innerHTML=`<span class="bad">● 数据源异常</span>　${e.message}`}}
function fixtureHtml(f){return `<div class="match"><strong>${f.home?.name||"主队"}　vs　${f.away?.name||"客队"}</strong><div class="small muted">${f.leagueName||"未知联赛"}　${f.date||""}　${f.status||""}</div><button class="btn primary" onclick='addMatch(${JSON.stringify(f).replace(/'/g,"&#39;")})'>加入比赛库</button></div>`}
async function loadFixtures(){try{let j=await api("/api/global/fixtures?date="+encodeURIComponent($("date").value||new Date().toISOString().slice(0,10)));window.fixtures=j.fixtures||[];renderFixtureFilter()}catch(e){$("fixtures").innerHTML=`<span class="bad">${e.message}</span>`}}
function renderFixtureFilter(){let q=$("q").value.trim().toLowerCase();let a=(window.fixtures||[]).filter(f=>(f.home.name+" "+f.away.name+" "+f.leagueName).toLowerCase().includes(q));$("fixtures").innerHTML=a.length?a.map(fixtureHtml).join(""):"没有匹配比赛"}
$("q").oninput=renderFixtureFilter;
async function loadLive(){try{let j=await api("/api/global/live");$("live").innerHTML=(j.fixtures||[]).length?j.fixtures.map(fixtureHtml).join(""):"暂无滚球"}catch(e){$("live").innerHTML=`<span class="bad">${e.message}</span>`}}
function addMatch(f){if(!db.matches.some(x=>String(x.providerId)===String(f.providerId))){db.matches.unshift(f);save();alert("已加入比赛库")}else alert("比赛已存在")}
$("refresh").onchange=()=>{clearInterval(timer);let n=+$("refresh").value;if(n)timer=setInterval(()=>{loadFixtures();loadLive()},n)}
async function register(){try{await api("/api/auth/register",{method:"POST",body:JSON.stringify({username:$("user").value,password:$("pass").value})});$("cloudMsg").textContent="注册成功，现在点击登录"}catch(e){$("cloudMsg").textContent=e.message}}
async function login(){try{let j=await api("/api/auth/login",{method:"POST",body:JSON.stringify({username:$("user").value,password:$("pass").value})});localStorage.setItem("pankou_v17_token",j.token);localStorage.setItem("pankou_v17_user",j.username);$("cloudState").textContent="已登录："+j.username;$("cloudMsg").textContent="登录成功";await pullCloud()}catch(e){$("cloudMsg").textContent=e.message}}
function logout(){localStorage.removeItem("pankou_v17_token");$("cloudState").textContent="未登录";$("cloudMsg").textContent="已退出"}
async function pullCloud(){let t=localStorage.getItem("pankou_v17_token");if(!t)return;try{let j=await api("/api/sync/pull",{headers:{Authorization:"Bearer "+t}});if(j.db){db=j.db;save()}}catch{}}
async function pushCloud(){let t=localStorage.getItem("pankou_v17_token");if(!t)return alert("请先登录");await api("/api/sync/push",{method:"POST",headers:{Authorization:"Bearer "+t},body:JSON.stringify(db)});alert("已同步")}
renderStats();renderMatches();show("home");
if(localStorage.getItem("pankou_v17_user"))$("cloudState").textContent="已登录："+localStorage.getItem("pankou_v17_user");
</script></body></html>
